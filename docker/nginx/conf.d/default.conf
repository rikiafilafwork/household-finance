# Satu origin: / → SPA (apps/web build), /api, /sanctum, /up → Laravel (php-fpm).
# Cookie Sanctum jadi first-party tanpa konfigurasi CORS.
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    root /var/www/web;
    index index.html;

    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        fastcgi_read_timeout 60s;
    }

    # Aset Vite ber-hash: aman di-cache selamanya.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback (React Router). index.html tidak di-cache supaya deploy baru langsung terpakai.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
