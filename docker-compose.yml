# Service: app (php-fpm), worker (queue:work), scheduler (schedule:work), nginx, mysql.
# Profil dev menambah mailpit. Jalankan: `make up`.
name: household-finance

x-api: &api
  build:
    context: .
    dockerfile: docker/app.Dockerfile
    target: ${APP_BUILD_TARGET:-dev}
  image: household-finance-api:${APP_BUILD_TARGET:-dev}
  volumes:
    - ./apps/api:/var/www/api
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *api

  worker:
    <<: *api
    command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600
    stop_signal: SIGTERM

  scheduler:
    <<: *api
    command: php artisan schedule:work

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/var/www/web:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-household_finance}
      MYSQL_USER: ${DB_USERNAME:-household}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  mysql-data:
